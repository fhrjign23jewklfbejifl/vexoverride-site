name: Refresh VEX data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vex-data-refresh.yml'
      - 'scripts/vex_sync.py'
      - 'scripts/test_vex_sync.py'
      - 'data/vex-sync-config.json'

permissions:
  contents: read

concurrency:
  group: vex-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s scripts -p 'test_vex_sync.py' -v
      - name: Refresh public and authenticated data
        id: refresh
        continue-on-error: true
        env:
          VEX_EVENTS_TOKEN: ${{ secrets.VEX_EVENTS_TOKEN }}
        run: |
          set +e
          python scripts/vex_sync.py
          result=$?
          if [ "$result" -lt 2 ]; then
            echo 'publishable=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$result"
      - name: Rebuild team lookup when present
        if: steps.refresh.outputs.publishable == 'true'
        run: |
          if [ -f scripts/build-team-index.mjs ]; then
            node scripts/build-team-index.mjs
          fi
      - name: Save valid snapshots and refresh status
        if: steps.refresh.outputs.publishable == 'true'
        run: |
          git add data/events data/season-204
          if [ -f v2/team-index.json ]; then
            git add v2/team-index.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public VEX data snapshots'
          git push origin HEAD:main
      - name: Report refresh failure
        if: steps.refresh.outcome == 'failure'
        run: exit 1

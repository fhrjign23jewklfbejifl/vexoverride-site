<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>VexOverride responsive review</title>
  <style>
    body {
      background: #303742;
      color: white;
      font: 15px system-ui;
      margin: 20px;
    }
    header {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      align-items: center;
    }
    select {
      padding: 8px;
    }
    iframe {
      display: block;
      border: 1px solid #5b6877;
      height: 820px;
      background: #10151d;
    }
    p {
      color: #c2ccd7;
    }
  </style>
  <header>
    <strong>Responsive review</strong
    ><label
      >Viewport
      <select id="width">
        <option>320</option>
        <option selected>390</option>
        <option>768</option>
        <option>1024</option>
      </select>
      px</label
    ><label
      >Page
      <select id="page">
        <option value="overview">Overview</option>
        <option value="score">Score</option>
        <option value="event">Competition</option>
        <option value="scout">Scouting</option>
        <option value="analysis">Analysis</option>
        <option value="picks">Picklist</option>
      </select></label
    >
  </header>
  <iframe title="Mobile workspace" src="../v2/?dev=1" width="390"></iframe>
  <p>
    Browser-width simulation. Still test touch, keyboard, and installation on a
    physical phone.
  </p>
  <script>
    const frame = document.querySelector("iframe");
    document.querySelector("#width").onchange = (e) =>
      (frame.width = e.target.value);
    document.querySelector("#page").onchange = (e) =>
      (frame.src = "../v2/?dev=1#" + e.target.value);
  </script>
</html>
